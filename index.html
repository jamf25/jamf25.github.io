<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fresh Start</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: purple;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 48px 32px;
            max-width: 700px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        h1 {
            margin: 0 0 16px;
            font-size: clamp(2rem, 4vw, 4rem);
        }

        p {
            margin: 0;
            font-size: clamp(1rem, 2vw, 1.4rem);
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Fresh Start</h1>
        <p>Everything has been reset and the page now has a purple background.</p>
    </div>
</body>
</html>
